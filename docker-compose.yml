version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: it-ticket-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: it_ticket_system
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_pass
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data: